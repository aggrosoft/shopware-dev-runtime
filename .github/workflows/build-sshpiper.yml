name: Build SSHPiper dev image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.sshpiper'
      - 'sshpiper-plugin/**'
      - '.github/workflows/build-sshpiper.yml'
  pull_request:
    paths:
      - 'Dockerfile.sshpiper'
      - 'sshpiper-plugin/**'
      - '.github/workflows/build-sshpiper.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sshpiper
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/aggrosoft/shopware-dev-sshpiper:main
            ghcr.io/aggrosoft/shopware-dev-sshpiper:sha-${{ github.sha }}

      - name: Smoke test plugin startup
        if: github.event_name != 'pull_request'
        run: |
          docker pull ghcr.io/aggrosoft/shopware-dev-sshpiper:main
          cid=$(docker run -d             -v /var/run/docker.sock:/var/run/docker.sock:ro             ghcr.io/aggrosoft/shopware-dev-sshpiper:main             -port 2222 /sshpiperd/plugins/docker-dev)
          sleep 3
          docker logs "$cid"
          docker rm -f "$cid"
